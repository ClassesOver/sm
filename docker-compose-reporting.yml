name: agentos-reporting

services:
  reporting-os:
    extends:
      file: docker-compose.yml
      service: agent
    command: ["python", "-m", "agentos_dev.coding.reporting"]
    ports: !override
      - "33046:7777"

  agent-db:
    extends:
      file: docker-compose.yml
      service: agent-db
    ports: !override []

volumes:
  agent_db_data:
