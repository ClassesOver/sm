[project]
name = "smart-reporting"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agno[mcp]==3.1.2",
    "dill>=0.3.9,<0.4.0",
    "fastmcp>=4,<5",
    "cryptography>=45,<51",
    "fastapi>=0.115",
    "matplotlib==3.11.1",
    "markdown-it-py==4.2.0",
    "openai>=1.0",
    "openinference-instrumentation-agno>=0.1.38,<0.2.0",
    "ipykernel>=6.29,<7.0",
    "jupyter-client>=8.6,<9.0",
    "openpyxl>=3.1,<4.0",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "fg-data-profiling>=4.20,<4.21",
    "setuptools>=72,<81",
    "pypandoc==1.17",
    "pypdf==6.14.2",
    "weasyprint==69.0",
    "xlrd>=2.0,<3.0",
    "plotly==6.9.0",
    "polars==1.43.2",
    "lxml==6.1.1",
    "python-dotenv>=1.2",
    "python-dateutil>=2.9,<3.0",
    "python-docx>=1.2,<2.0",
    "scipy==1.16.3",
    "seaborn==0.13.2",
    "statsmodels==0.15.0",
    "sympy==1.14.0",
    "tabulate==0.10.0",
    "adjusttext==1.4.0",
    "altair==6.3.0",
    "bokeh==3.10.0",
    "plotnine==0.15.8",
    "pygal==3.1.3",
    "graphviz==0.21",
    "pillow==12.3.0",
    "xlsxwriter==3.2.9",
    "odfpy==1.4.1",
    "python-pptx==1.0.2",
    "reportlab==5.0.1",
    "pdfplumber==0.11.10",
    "pymupdf==1.28.2",
    "pikepdf==10.13.0.post1",
    "cairosvg==2.9.1",
    "beautifulsoup4==4.15.0",
    "jinja2==3.1.6",
    "pyarrow==25.0.1",
    "duckdb==1.5.5",
    "jsonpointer==3.1.1",
    "jsonschema>=4.26,<5.0",
    "jmespath==1.0.1",
    "loguru>=0.7,<1.0",
    "unidiff==0.7.5",
    "types-python-dateutil>=2.9,<3.0",
    "python-multipart>=0.0.20",
    "requests>=2.32,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "sqlglot>=28.0,<29.0",
    "starrocks==1.3.3",
    "tiktoken>=0.9,<1.0",
    "tokenizers>=0.21,<1.0",
    "uvicorn[standard]>=0.30",
    "dingyi-agno==0.5.5",
    "python-lsp-server>=1.15.0",
    "ruff>=0.12,<1.0",
    "kaleido>=1.4.0",
]

[dependency-groups]
dev = [
    "lark>=1.3,<2",
    "mypy>=1.17,<2.0",
    "pytest>=8.3,<10.0",
    "xlwt>=1.3,<2.0",
    "pytest-playwright>=0.7,<1.0",
    "hypothesis>=6.100,<7",
]

[tool.uv]
# 服务端应用只在 Linux（部署镜像）与 Windows/macOS 开发机运行；不解析 emscripten（浏览器
# WebAssembly）分支，否则精确锁定的 statsmodels 等包在该平台无可用版本而无法生成锁文件。
environments = ["sys_platform != 'emscripten'"]

[tool.pytest.ini_options]
testpaths = [
    "smart_reporting/task_execution/tests",
    "smart_reporting/reporting/tests",
    "smart_reporting/reporting_mcp/tests",
    "smart_reporting/tests",
]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: requires external services such as PostgreSQL"]
# 第三方库内部的弃用提示（starlette TestClient 引用 anyio 旧别名、data_profiling 调用 utcnow），
# 不在本项目代码中；按来源模块精确忽略，其余警告照常显示。
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:data_profiling.model.describe",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["smart_reporting"]
exclude = ["smart_reporting/(?:task_execution/|reporting/)?tests"]
