[project]
name = "smart-reporting"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agno==3.0.9",
    "dill>=0.3.9,<0.4.0",
    "fastmcp>=3.4.3,<4",
    "daytona==0.189.0",
    "cryptography>=45,<51",
    "fastapi>=0.115",
    "matplotlib>=3.9,<3.11",
    "markdown-it-py==4.2.0",
    "openai>=1.0",
    "openinference-instrumentation-agno>=0.1.38,<0.2.0",
    "ipykernel>=6.29,<7.0",
    "jupyter-client>=8.6,<9.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<2.4",
    "fg-data-profiling>=4.19,<4.20",
    "setuptools>=72,<81",
    "pypdf>=6.0,<7.0",
    "weasyprint==69.0",
    "xlrd>=2.0,<3.0",
    "plotly>=6.0,<6.6",
    "polars>=1.35,<2.0",
    "python-dotenv>=1.2",
    "python-dateutil>=2.9,<3.0",
    "jsonpointer==3.1.1",
    "jsonschema>=4.26,<5.0",
    "jmespath==1.0.1",
    "loguru>=0.7,<1.0",
    "unidiff==0.7.5",
    "types-python-dateutil>=2.9,<3.0",
    "python-multipart>=0.0.20",
    "requests>=2.32,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "sqlglot>=28.0,<29.0",
    "starrocks==1.3.3",
    "tiktoken>=0.9,<1.0",
    "tokenizers>=0.21,<1.0",
    "tree-sitter==0.26.0",
    "tree-sitter-bash==0.25.1",
    "uvicorn[standard]>=0.30",
    "dingyi-agno==0.5.0",
    "python-lsp-server>=1.15.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.12,<1.0",
    "xlwt>=1.3,<2.0",
]

[tool.pytest.ini_options]
testpaths = [
    "smart_reporting/task_execution/tests",
    "smart_reporting/reporting/tests",
    "smart_reporting/reporting_mcp/tests",
    "smart_reporting/tests",
]
addopts = "-m 'not integration'"
markers = ["integration: requires external services such as PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["smart_reporting"]
exclude = ["smart_reporting/(?:task_execution/|reporting/)?tests"]
