[tool.pytest.ini_options]
testpaths = [
    "smart_reporting/task_execution/tests",
    "smart_reporting/reporting/tests",
    "smart_reporting/tests",
]
addopts = "-m 'not integration'"
markers = ["integration: requires external services such as PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["smart_reporting"]
exclude = ["smart_reporting/(?:task_execution/|reporting/)?tests"]
