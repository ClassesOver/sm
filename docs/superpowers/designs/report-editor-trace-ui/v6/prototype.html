const data={east:{name:'华东营收',type:'事实',icon:'graph',value:12450,online:4230,offline:8220,calc:'ecalc',ref:'eref',region:'华东'},north:{name:'华北营收',type:'事实',icon:'graph',value:8320,online:3120,offline:5200,calc:'ncalc',ref:'nref',region:'华北'},ecalc:{name:'渠道收入汇总',type:'计算',icon:'calc',fact:'east'},ncalc:{name:'华北收入汇总',type:'计算',icon:'calc',fact:'north'},source:{name:'收入明细.csv',type:'快照',icon:'file'},mapping:{name:'渠道映射.csv',type:'快照',icon:'file'},eref:{name:'表 2.1 · 华东营收',type:'引用',icon:'report',fact:'east'},nref:{name:'表 2.1 · 华北营收',type:'引用',icon:'report',fact:'north'},etext:{name:'营收分析 · 第 1 段',type:'引用',icon:'file',fact:'east'},ntext:{name:'营收分析 · 第 2 段',type:'引用',icon:'file',fact:'north'}};
const rows=[['华东','线上',4230,'2026 Q3'],['华东','线下',8220,'2026 Q3'],['华北','线上',3120,'2026 Q3'],['华北','线下',5200,'2026 Q3'],['华南','线上',1980,'2026 Q3'],['华南','线下',5000,'2026 Q3']];
let tabs=[],active='east',counter=0,difference=false,scene='inspect',reportScroll=0,reportFocus=null,dirFilter='',toastTimer;
const fmt=n=>Number(n).toLocaleString('en-US');
function page(id,path){return {id,path,selected:null,collapsed:['快照','分析','补充发现','结果表','分析说明'].includes(data[id].type),filter:'',scroll:0};}
function task(id){return {key:'task-'+(++counter),root:id,label:data[id].name,history:[page(id,[id])],index:0,used:Date.now()};}
function init(){workflowMode='accepted';tabs=[task('analysis'),task('east')];active=tabs[0].key;difference=false;scene='workflow';reportFocus=null;render();}
function currentTask(){return tabs.find(t=>t.key===active)}
function state(){let t=currentTask();return t?.history[t.index]}
function remember(){const w=document.querySelector('.workspace');if(active==='report')reportScroll=w?.scrollTop||0;else if(state())state().scroll=w?.scrollTop||0;}
function announce(s){document.getElementById('announcer').textContent=s;}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,2600);}
function switchTab(key){remember();active=key;if(currentTask())currentTask().used=Date.now();render();}
function openTask(id,background=false){remember();let t=tabs.find(t=>t.root===id);if(!t){t=task(id);tabs.push(t);}if(!background){active=t.key;t.used=Date.now();}render();announce((background?'已在后台打开：':'已打开核对任务：')+t.label);}
function navigate(id){if(!data[id])return;if(!hasEvidence()&&data[id].workflow&&!['analysis','basicAnalysis'].includes(id)){toast('当前场景没有已接收的补充结果');return;}if(active==='report'){openTask(id);return;}const s=state();if(s.id===id)return;remember();let t=currentTask();const at=s.path.indexOf(id);const path=at<0?[...s.path,id]:s.path.slice(0,at+1);const saved=[...t.history.slice(0,t.index+1)].reverse().find(p=>p.id===id&&p.path.join('/')===path.join('/'));const p=saved?structuredClone(saved):page(id,path);t.history=t.history.slice(0,t.index+1);t.history.push(p);t.index++;render();document.querySelector('.object-title')?.focus({preventScroll:true});announce('已进入'+data[id].name);}
function historyGo(delta){const t=currentTask();if(!t||t.index+delta<0||t.index+delta>=t.history.length)return;remember();t.index+=delta;render();}
function closeTab(key){remember();const i=tabs.findIndex(t=>t.key===key);if(i<0)return;tabs.splice(i,1);if(active===key)active=[...tabs].sort((a,b)=>b.used-a.used)[0]?.key||'report';render();document.querySelector('[role=tab][aria-selected=true]')?.focus();}
function graphFact(){let t=currentTask(),root=data[t.root];return root.type==='事实'?t.root:root.fact||'east'}
function nodeList(){const f=graphFact(),d=data[f];return [{id:'source',x:3,y:23},{id:'mapping',x:3,y:62},{id:d.calc,x:29,y:43},{id:f,x:55,y:43},{id:d.ref,x:80,y:23},{id:f==='east'?'etext':'ntext',x:80,y:62}];}
function navButton(id,label){return `<button class="link" data-action="navigate" data-id="${id}">${label||'进入'} ${icon('arrow')}</button>`}
function objectRow(id,desc,label){return `<div class="object-row">${icon(data[id].icon)}<div><b>${data[id].name}</b><div class="desc">${desc}</div></div>${navButton(id,label)}</div>`}
function topTabs(){return `<div class="tabs-line"><div class="tabs" role="tablist" aria-label="核对任务"><div class="tab-wrap ${active==='report'?'active':''}" role="presentation"><button id="tab-report" class="tab" role="tab" aria-selected="${active==='report'}" aria-controls="panel-report" tabindex="${active==='report'?0:-1}" data-action="tab" data-id="report">${icon('report')}报告正文</button></div>${tabs.map(t=>`<div class="tab-wrap ${active===t.key?'active':''}" role="presentation"><button class="tab" id="tab-${t.key}" role="tab" aria-selected="${active===t.key}" aria-controls="panel-${t.key}" tabindex="${active===t.key?0:-1}" data-action="tab" data-id="${t.key}" title="${t.label} / ${data[t.history[t.index].id].name}">${icon(data[t.root].icon)}${t.label}<span class="tab-stage">${data[t.history[t.index].id].type}</span></button><button class="tab-close" data-action="close" data-id="${t.key}" aria-label="关闭${t.label}任务" title="关闭任务">×</button></div>`).join('')}</div><button class="tab-new" data-action="directory" title="从目录选择另一项核对任务" aria-label="从来源目录打开任务">＋</button></div>`}
function navBar(){const t=currentTask(),s=state();return `<div class="nav"><button class="mobile-toggle nav-arrow" data-action="directory" aria-label="来源目录">☰</button><button class="nav-arrow" data-action="back" ${!t||t.index===0?'disabled':''} aria-label="在当前任务中后退">‹</button><button class="nav-arrow" data-action="forward" ${!t||t.index===t.history.length-1?'disabled':''} aria-label="在当前任务中前进">›</button><span class="nav-label">${s?'探索路径':'正在编辑'}</span><nav class="crumb" aria-label="探索路径">${s?s.path.map((id,i)=>`${i?'<span class="sep" aria-hidden="true">/</span>':''}${i===s.path.length-1?`<span aria-current="page">${data[id].name}</span>`:`<button data-action="navigate" data-id="${id}">${data[id].name}</button>`}`).join(''):'<span aria-current="page">报告正文</span>'}</nav><div class="grow"></div><span class="revision">修订 12 · 2026-09-30 快照</span></div>`}
function sidebar(){return `<aside class="sidebar"><div class="side-head"><span>来源目录</span><span class="small muted">修订 12</span></div><input class="side-search" aria-label="搜索当前来源目录" placeholder="搜索本修订对象" value="${dirFilter.replaceAll('"','&quot;')}"><div id="directory-items">${directoryItems()}</div><div class="side-note">目录用于开启另一项核对。<br>当前任务内，沿关系继续进入。</div></aside>`}
function directoryItems(){const groups=[['分析项',['basicAnalysis','analysis']],['确定性事实',['east','north']],...(hasEvidence()?[['补充结果',['results']],['计算记录',['supplement','ecalc']]]:[['计算记录',['ecalc']]]),['数据快照',['source','mapping']]];return groups.map(([name,ids])=>{ids=ids.filter(id=>data[id].name.includes(dirFilter));return ids.length?`<div class="group-label">${name}<span>${ids.length}</span></div>${ids.map(id=>`<button class="side-item ${state()?.id===id?'current':''}" data-action="new" data-id="${id}" title="打开${data[id].name}任务">${icon(data[id].icon)}${data[id].name}<span class="external" aria-hidden="true">↗</span></button>`).join('')}`:''}).join('')||'<p class="small muted">没有匹配对象</p>'}
function header(){const s=state(),d=data[s.id];if(d.workflow)return workflowHeader();if(d.type==='事实'){const draft=d.value+(difference&&s.id==='east'?330:0);return `<div class="object-header"><div><div class="eyebrow"><span class="type">事实</span><span>来自表 2.1 · ${d.region}营收</span></div><h1 class="object-title" tabindex="-1">${d.name}</h1><p>先看数值是否一致，再沿关系查证口径。</p></div><div class="value-summary num"><div class="value-block"><span>报告当前值</span><strong>${fmt(draft)}<small class="unit">万元</small></strong></div><div class="value-divider"></div><div class="value-block registered"><span>登记值 · 修订 12</span><strong>${fmt(d.value)}<small class="unit">万元</small></strong></div></div></div><div class="status-row"><span class="${draft===d.value?'good':''}">${draft===d.value?'✓ 引用有效':'△ 引用已变更'}</span><span class="good">✓ 登记值数值核对通过</span><span>复算条件有限</span></div>${draft!==d.value?`<div class="warning"><b>△ 报告值比登记值高 ${fmt(draft-d.value)} 万元</b><span>未自动替换正文，可继续编辑。</span><button class="link" data-action="report" data-id="east">定位并编辑正文 ↗</button></div>`:''}`;}return `<div class="object-header"><div><div class="eyebrow"><span class="type">${d.type==='快照'?'数据快照':d.type}</span><span>当前任务 · ${currentTask().label}</span></div><h1 class="object-title" tabindex="-1">${d.name}</h1><p>${d.type==='快照'?'固定快照 · 2026-09-30 · '+(s.id==='source'?'6 行 · 4 个字段':'2 行 · 2 个字段'):'已登记的计算与引用关系 · 修订 12'}</p></div><div class="grow"></div>${d.type==='快照'?`<button class="btn" data-action="copy">复制本页</button><button class="btn primary" data-action="download">下载此快照 ↓</button>`:''}</div>`}
function graph(){if(workflowScope())return workflowGraph();const s=state();return `<section class="graph ${s.collapsed?'collapsed':''}" aria-label="来源与引用关系"><div class="graph-top">${icon('graph')}<strong>来源与引用</strong><span class="scope">任务范围 · ${currentTask().label}</span><div class="grow"></div><button data-action="list">${s.showList?'关系图':'关系列表'}</button><span class="separator"></span><button data-action="collapse" aria-expanded="${!s.collapsed}">${s.collapsed?'展开关系图 ↓':'收起 ↑'}</button></div>${s.collapsed?'':`${s.showList?relationList():graphMap()}<div class="graph-legend"><span><i class="key"></i>当前页</span><span><i class="key outline"></i>预览选择</span><span>箭头：数据流向 →</span><div class="grow"></div><span class="map-tip">已加载 6 个节点 · 局部关系</span></div><div class="preview" id="node-preview">${preview()}</div>`}</section>`}
function graphMap(){const s=state(),f=graphFact(),d=data[f];return `<div class="graph-scroll"><div class="graph-map"><span class="lane" style="left:3%">数据快照</span><span class="lane" style="left:29%">计算</span><span class="lane" style="left:55%">事实</span><span class="lane" style="left:80%">报告引用</span><svg viewBox="0 0 1160 250" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#80a2bd"/></marker></defs><g fill="none" stroke="#80a2bd" stroke-width="1.5" marker-end="url(#arr)"><path d="M245 92C290 92 287 142 335 142"/><path d="M245 190C293 190 287 142 335 142"/><path d="M546 142H636"/><path d="M848 142C888 142 885 92 926 92"/><path d="M848 142C888 142 885 190 926 190"/></g><g font-size="10" fill="#8193a3"><text x="286" y="81">输入</text><text x="580" y="130">产出</text><text x="882" y="80">引用</text></g></svg>${nodeList().map(n=>{let obj=data[n.id];let sub=obj.type==='快照'?'固定快照 · 09-30':obj.type==='事实'?fmt(obj.value)+' 万元':obj.type==='计算'?'线上 + 线下':'点击预览正文位置';return `<button class="node ${s.id===n.id?'current':''} ${s.selected===n.id?'selected':''}" style="left:${n.x}%;top:${n.y}%" data-node="${n.id}" aria-label="预览${obj.type}：${obj.name}" aria-pressed="${s.selected===n.id}"><span class="node-title">${icon(obj.icon)}${obj.name}</span><span class="node-sub">${sub}</span><span class="node-tag" ${s.id!==n.id&&s.selected!==n.id?'hidden':''}>${s.id===n.id?'当前页':'预览'}</span></button>`}).join('')}</div></div>`}
function relationList(){const f=graphFact(),d=data[f];return `<div style="padding:8px 16px">${[['source',d.calc,'输入'],['mapping',d.calc,'输入'],[d.calc,f,'产出'],[f,d.ref,'引用'],[f,f==='east'?'etext':'ntext','引用']].map(([a,b,l])=>`<div class="object-row"><button class="link" data-node="${a}">${data[a].name}</button><span class="muted">— ${l} →</span><button class="link" data-node="${b}">${data[b].name}</button></div>`).join('')}</div>`}
function preview(){const s=state(),id=s.selected;if(!id)return `<span class="preview-empty">${icon('graph')} 单击节点先看摘要，点击“进入”继续下钻。当前页面保持不变。</span>`;const d=data[id];return `<div class="preview-icon">${icon(d.icon)}</div><div><div class="preview-name">${d.name}<span class="small muted" style="font-weight:400;margin-left:10px">${d.type} · 预览</span></div><div class="preview-desc">${d.workflow?workflowPreview(d):d.type==='计算'?'2 个已登记输入 · 数值核对记录可查看':d.type==='快照'?'进入后查看整个快照，不自动推定关联行':d.type==='事实'?'登记值 '+fmt(d.value)+' 万元':'进入查看引用上下文，也可定位正文'}</div></div><div class="grow"></div><button class="btn" data-action="new" data-id="${id}">新页签打开 ↗</button><button class="btn primary" data-action="navigate" data-id="${id}" ${id===s.id?'disabled':''}>${id===s.id?'已在当前页':'进入'+d.type+' →'}</button><button data-action="dismiss" aria-label="关闭节点预览">×</button>`}
function selectNode(id){state().selected=id;document.querySelectorAll('[data-node]').forEach(el=>{if(!el.classList.contains('node'))return;el.classList.toggle('selected',el.dataset.node===id);el.setAttribute('aria-pressed',el.dataset.node===id);const tag=el.querySelector('.node-tag');tag.hidden=el.dataset.node!==state().id&&el.dataset.node!==id;tag.textContent=el.dataset.node===state().id?'当前页':'预览';});document.getElementById('node-preview').innerHTML=preview();announce('预览'+data[id].name+'，当前页面未改变');}
function formula(f){const d=data[f];return `<div class="formula num"><div class="term"><strong>${fmt(d.online)}</strong><span>线上收入 · 万元</span></div><span class="operator">+</span><div class="term"><strong>${fmt(d.offline)}</strong><span>线下收入 · 万元</span></div><span class="operator">=</span><div class="term"><strong>${fmt(d.value)}</strong><span>登记值 · 万元</span></div></div>`}
function details(){const s=state(),d=data[s.id];if(d.workflow)return workflowDetails();if(d.type==='事实')return `<div class="details-grid"><section><h2><span class="section-no">01</span> 计算口径</h2>${formula(s.id)}${objectRow(d.calc,'已登记计算 · 查看方法、输入及核对记录','进入计算')}<div class="small muted">口径来自登记记录，未执行实时复算。</div></section><section><h2><span class="section-no">02</span> 正文引用</h2><div class="object-row">${icon('report')}<div><b>表 2.1 · ${d.region}营收</b><div class="desc">本次核对的起点</div></div><button class="link" style="margin-left:auto" data-action="report" data-id="${s.id}">定位正文 ↗</button></div><div class="object-row">${icon('file')}<div><b>营收分析 · ${s.id==='east'?'第 1 段':'第 2 段'}</b><div class="desc">同一登记事实的另一处引用</div></div><button class="link" style="margin-left:auto" data-action="report" data-id="${s.id}">定位正文 ↗</button></div><div class="callout">正文修改后，引用状态与登记值的核对状态分别展示。</div></section></div>`;if(d.type==='计算')return `<div class="details-grid"><section><h2><span class="section-no">01</span> 方法与核对</h2><div class="calc-method"><span class="small muted">收入按渠道汇总 · 单位：万元</span>${formula(d.fact)}</div><div class="calc-meta"><div><span>独立数值核对</span>通过 · 针对登记输出</div><div><span>复算条件</span>有限 · 需原执行环境</div></div><div class="callout">不会仅根据两项输入相加相等，就推定“已独立核对”。</div></section><section><h2><span class="section-no">02</span> 输入数据</h2>${objectRow('source','数据快照 · 6 行 · 2026-09-30','进入快照')}${objectRow('mapping','数据快照 · 2 行 · 2026-09-30','进入快照')}${objectRow(d.fact,'已登记输出事实','查看输出')}</section></div>`;if(d.type==='快照')return dataset();return `<div class="source-info"><h2>报告引用上下文</h2><p>表 2.1 · ${data[d.fact].region}营收：<strong class="num">${fmt(data[d.fact].value)} 万元</strong></p><p class="muted">引用有效性与数值核对是不同状态。此处展示示例定位。</p><button class="btn primary" data-action="report" data-id="${d.fact}">定位正文 ↗</button> ${navButton(d.fact,'进入事实')}</div>`}
function dataset(){const s=state();return `<div class="dataset-context"><b>当前展示整个快照</b><span class="muted"> · 从计算进入，不代表这些行都属于当前事实。</span></div><div class="table-title"><h2><span class="section-no">01</span> 数据预览</h2><span class="small muted">只读</span><input id="row-filter" aria-label="仅筛选本页已加载内容" placeholder="仅筛选本页已加载内容" value="${s.filter.replaceAll('"','&quot;')}"></div><div class="table-scroll"><table class="data-table"><thead>${s.id==='source'?'<tr><th>预览序号</th><th>区域<small>region</small></th><th>渠道<small>channel</small></th><th class="amount">收入（万元）<small>revenue</small></th><th>期间<small>period</small></th></tr>':'<tr><th>预览序号</th><th>渠道代码</th><th>渠道名称</th></tr>'}</thead><tbody id="data-rows">${tableRows()}</tbody></table></div><div class="table-foot"><span id="row-count">${rowCount()}</span><span><button class="btn" disabled>‹</button>　1 / 1　<button class="btn" disabled>›</button></span></div><div class="small muted" style="margin-bottom:20px">预览序号不代表原始文件行号。筛选仅作用于已加载的本页，下载仍是整个快照。</div><h2><span class="section-no">02</span> 已加载的使用关系</h2>${objectRow(workflowScope()?'supplement':'ecalc','已登记为计算输入；更多下游尚未查询','进入计算')}`}
function currentRows(){return state().id==='source'?rows.map((r,i)=>workflowMode==='warning'&&i===1?[r[0],r[1],8240,r[3]]:r):[['online','线上'],['offline','线下']]}
function filteredRows(){const q=state().filter.toLowerCase();return currentRows().map((r,i)=>({r,i})).filter(({r})=>r.join(' ').toLowerCase().includes(q));}

 if(id==='onlineShare')return `<div class="details-grid"><section><h2><span class="section-no">01</span> 发现内容</h2><div class="result-hero"><div class="big-number">33.98<small>%</small></div><p>线上收入占华东收入合计的比例 · 2026 Q3</p></div><div class="calc-method"><span class="small muted">证据中声明的口径</span><p class="num" style="font-size:21px;color:var(--blue)">4,230 ÷ 12,450 × 100 ≈ 33.98%</p></div><div class="workflow-meta"><div><small>单位</small>%</div><div><small>结果显示精度</small>保留两位小数</div><div><small>集合内位置</small>第 2 项发现</div><div><small>独立 fact 身份</small>未登记</div></div></section><section><h2><span class="section-no">02</span> 来源与适用限制</h2><div class="workflow-note">此页用于阅读集合内的单值发现。未登记精确正文绑定，不并列一个猜测的“报告值”，也不默认可以按其他维度下钻。</div>${objectRow('results','包含此发现的冻结补充证据','返回结果集')}${objectRow('supplement','生成当前结果集的计算记录','查看计算')}<div class="callout">本例的公式和范围由示例证据明确提供。真实记录没有这些字段时，应显示“未提供”，不反推算法。</div></section></div>`;
 if(id==='channelTable')return `<h2><span class="section-no">01</span> 表格型发现 <span class="tag-neutral">2 行 · 集合第 1 项</span></h2><div class="table-scroll"><table class="data-table results-table"><thead><tr><th>渠道</th><th class="amount">收入（万元）</th><th class="amount">占比（%）</th><th>浏览</th></tr></thead><tbody>${[['线上','4,230','33.98'],['线下','8,220','66.02']].map((r,i)=>`<tr class="${state().resultRow===i?'row-selected':''}"><td>${r[0]}</td><td class="amount">${r[1]}</td><td class="amount">${r[2]}</td><td><button class="link" data-action="result-row" data-id="${i}">查看该行</button></td></tr>`).join('')}</tbody></table></div>${Number.isInteger(state().resultRow)?`<div class="row-detail"><b>${state().resultRow===0?'线上 / 4,230 万元 / 33.98%':'线下 / 8,220 万元 / 66.02%'}</b><br>这是结果表第 ${state().resultRow+1} 行的内容预览，未登记独立 fact 身份或原始数据行映射。<button class="link" data-action="result-row-close">收起</button></div>`:''}<div class="workflow-note" style="margin-top:18px">查看行内容不新建 fact、不改变面包屑。只有后端签发具体 fact 定位后，才能提供独立事实页与精确引用入口。</div><div class="details-grid"><section>${objectRow('results','返回发现清单，保留当前任务','返回结果集')}</section><section>${objectRow('supplement','方法、输入与业务对账','查看生成计算')}</section></div>`;
 if(id==='channelNote')return `<div class="details-grid"><section><h2>解释性发现</h2><div class="workflow-quote">在本次华东收入样本中，线下收入占比约为三分之二，线上约为三分之一。</div></section><section><h2>解读边界</h2><div class="workflow-note">该说明描述当前样本结构，不是“线上渠道导致收入增长”的因果结论。文字内容没有独立数值核对状态。</div>${objectRow('results','说明所属的补充证据集合','返回结果集')}${objectRow('channelTable','查看同一证据中的结构结果','查看结果表')}</section></div>`;
 return `<h2>分析级引用上下文</h2><div class="workflow-quote">从渠道结构看，线下仍是本期收入的主要来源。</div><div class="workflow-note" style="margin-top:18px">当前是分析 / 计算层级的引用，不承诺定位“33.98%”这个单值，也不把解释文字标记为数值已核对。</div>${objectRow('analysis','本次分析采用的依据与缺口','查看分析')}${objectRow('supplement','当前引用登记的计算记录','查看计算')}<button class="btn" data-action="report" data-id="analysis">定位分析段落 ↗</button>`;
}
function workflowNodes(){const child=resultIds.includes(state().id)?state().id:null;return [{id:'source',x:3,y:39},{id:'supplement',x:29,y:39},{id:'results',x:55,y:20},...(child?[{id:child,x:80,y:20}]:[]),{id:'analysisRef',x:80,y:65}];}
function workflowEdges(){const edges=[['source','supplement','已登记输入'],['supplement','results','产出集合'],['supplement','analysisRef','计算级引用']];if(resultIds.includes(state().id))edges.push(['results',state().id,'包含（非计算）']);return edges;}
function workflowGraph(){if(currentTask()?.root==='basicAnalysis'||state().id==='basicAnalysis'||!hasEvidence())return '';const s=state(),nodes=workflowNodes(),child=resultIds.includes(s.id);return `<section class="graph workflow-graph ${s.collapsed?'collapsed':''}" aria-label="补充分析来源关系"><div class="graph-top">${icon('graph')}<strong>来源与引用</strong><span class="scope">补充分析 · 实线为已登记关系</span><div class="grow"></div><button data-action="list">${s.showList?'关系图':'关系列表'}</button><span class="separator"></span><button data-action="collapse" aria-expanded="${!s.collapsed}">${s.collapsed?'展开关系图 ↓':'收起 ↑'}</button></div>${s.collapsed?'':`${s.showList?`<div style="padding:8px 16px">${workflowEdges().map(([a,b,l])=>`<div class="object-row"><button class="link" data-node="${a}">${data[a].name}</button><span class="muted">— ${l} →</span><button class="link" data-node="${b}">${data[b].name}</button></div>`).join('')}</div>`:`<div class="graph-scroll"><div class="graph-map"><span class="lane" style="left:3%">输入快照</span><span class="lane" style="left:29%">补充计算</span><span class="lane" style="left:55%">结果集</span><span class="lane" style="left:80%">${child?'集合内发现 / 分析引用':'分析引用'}</span><svg viewBox="0 0 1160 220" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="wfarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#80a2bd"/></marker></defs><g fill="none" stroke="#80a2bd" stroke-width="1.5" marker-end="url(#wfarr)"><path d="M245 119H335"/><path d="M546 119C589 119 593 76 636 76"/><path d="M440 151V202H915V175H926"/>${child?'<path d="M848 76H926" stroke-dasharray="4 4"/>':''}</g><g fill="#7990a2" font-size="9"><text x="282" y="109">输入</text><text x="585" y="72">产出</text><text x="695" y="193">计算级引用</text>${child?'<text x="881" y="64">包含</text>':''}</g></svg>${nodes.map(n=>{const d=data[n.id],sub=n.id==='results'?'3 项发现 · 集合级锚点':n.id==='supplement'?'已执行 · 未独立核对':n.id==='source'?'冻结快照 · 2026 Q3':n.id==='analysisRef'?'非单条结果的精确绑定':'集合内条目 · 非独立 fact';return `<button class="node ${s.id===n.id?'current':''} ${s.selected===n.id?'selected':''}" data-node="${n.id}" style="left:${n.x}%;top:${n.y}%" aria-label="预览${d.type}：${d.name}" aria-pressed="${s.selected===n.id}"><span class="node-title">${icon(d.icon)}${d.name}</span><span class="node-sub">${sub}</span><span class="node-tag" ${s.id!==n.id&&s.selected!==n.id?'hidden':''}>${s.id===n.id?'当前页':'预览'}</span></button>`}).join('')}</div></div>`}<div class="graph-legend"><span><i class="key"></i>当前页</span><span><i class="key outline"></i>预览</span><span>虚线：集合包含关系</span><div class="grow"></div><span>已加载 ${nodes.length} 个节点 · 局部关系</span></div><div class="preview" id="node-preview">${preview()}</div><div class="graph-note">仅显示已登记输入。集合内条目暂不支持原始行定位。</div>`}</section>`;}
function workflowPreview(d){if(d.workflow)return d.type==='计算'?'执行完成 · 独立核对未进行 · 可查看已登记输入':d.type==='结果集'?'3 项发现 · 仅集合级输出引用':d.type==='引用'?'分析级引用；不提供单值精确绑定':d.type==='分析'?'查看补证决策、采用的依据与历史记录':'集合内条目；未登记独立 fact 身份';return '';}
function workflowScene(mode){remember();workflowMode=mode;scene='workflow';difference=false;const t=task(mode==='sufficient'?'basicAnalysis':'analysis');tabs=[t,task('east')];active=t.key;render();}

document.addEventListener('change',e=>{if(e.target.id==='workflow-mode')workflowScene(e.target.value);});
init();
</script>
</body>
</html>
