name: daytona

services:
  env-init:
    build:
      context: ..
      dockerfile: Dockerfile
      target: env-init
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-mirrors.aliyun.com}
    profiles: [setup]
    working_dir: /workspace
    user: "0:0"
    environment:
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
    volumes:
      - ..:/workspace
    network_mode: none
    entrypoint: ["bash", "/workspace/scripts/configure_daytona_env.sh"]
    command: ["/workspace/docker/.env"]

  api:
    image: ${DAYTONA_IMAGE_REGISTRY:-docker.io}/daytonaio/daytona-api:v0.189.0-${DAYTONA_IMAGE_ARCH:-amd64}
    ports:
      - "0.0.0.0:${DAYTONA_API_PORT:-33043}:3000"
    environment:
      OTEL_ENABLED: "false"
      DEFAULT_SNAPSHOT: ${DAYTONA_DEFAULT_SNAPSHOT:-docker.m.daocloud.io/daytonaio/sandbox:0.5.0-slim}
      ENCRYPTION_KEY: ${DAYTONA_ENCRYPTION_KEY:?必须设置}
      ENCRYPTION_SALT: ${DAYTONA_ENCRYPTION_SALT:?必须设置}
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ${DAYTONA_POSTGRES_USER:-daytona}
      DB_PASSWORD: ${DAYTONA_POSTGRES_PASSWORD:?必须设置}
      DB_DATABASE: ${DAYTONA_POSTGRES_DB:-daytona}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${DAYTONA_REDIS_PASSWORD:?必须设置}
      OIDC_CLIENT_ID: daytona
      OIDC_ISSUER_BASE_URL: http://dex:5556/dex
      PUBLIC_OIDC_DOMAIN: ${DAYTONA_PUBLIC_SCHEME:-http}://${DAYTONA_PUBLIC_HOST:-127.0.0.1}:${DAYTONA_DEX_PORT:-33047}/dex
      OIDC_AUDIENCE: daytona
      DASHBOARD_URL: ${DAYTONA_PUBLIC_SCHEME:-http}://${DAYTONA_PUBLIC_HOST:-127.0.0.1}:${DAYTONA_API_PORT:-33043}/dashboard
      DASHBOARD_BASE_API_URL: ${DAYTONA_PUBLIC_SCHEME:-http}://${DAYTONA_PUBLIC_HOST:-127.0.0.1}:${DAYTONA_API_PORT:-33043}
      TRANSIENT_REGISTRY_URL: http://registry:6000
      TRANSIENT_REGISTRY_ADMIN: ${DAYTONA_REGISTRY_USER:-daytona}
      TRANSIENT_REGISTRY_PASSWORD: ${DAYTONA_REGISTRY_PASSWORD:?必须设置}
      TRANSIENT_REGISTRY_PROJECT_ID: daytona
      INTERNAL_REGISTRY_URL: http://registry:6000
      INTERNAL_REGISTRY_ADMIN: ${DAYTONA_REGISTRY_USER:-daytona}
      INTERNAL_REGISTRY_PASSWORD: ${DAYTONA_REGISTRY_PASSWORD:?必须设置}
      INTERNAL_REGISTRY_PROJECT_ID: daytona
      S3_ENDPOINT: http://minio:9000
      S3_STS_ENDPOINT: http://minio:9000/minio/v1/assume-role
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${DAYTONA_MINIO_USER:-daytona}
      S3_SECRET_KEY: ${DAYTONA_MINIO_PASSWORD:?必须设置}
      S3_DEFAULT_BUCKET: daytona
      S3_ACCOUNT_ID: /
      S3_ROLE_NAME: /
      ENVIRONMENT: docker-compose
      MAX_AUTO_ARCHIVE_INTERVAL: "43200"
      MAINTENANCE_MODE: "false"
      NOTIFICATION_GATEWAY_DISABLED: "true"
      PROXY_DOMAIN: ${DAYTONA_PROXY_DOMAIN:-proxy.localhost:33044}
      PROXY_PROTOCOL: ${DAYTONA_PUBLIC_SCHEME:-http}
      PROXY_API_KEY: ${DAYTONA_PROXY_API_KEY:?必须设置}
      PROXY_TEMPLATE_URL: ${DAYTONA_PUBLIC_SCHEME:-http}://{{PORT}}-{{sandboxId}}.${DAYTONA_PROXY_DOMAIN:-proxy.localhost:33044}
      PROXY_TOOLBOX_BASE_URL: ${DAYTONA_PUBLIC_SCHEME:-http}://${DAYTONA_PROXY_DOMAIN:-proxy.localhost:33044}
      DEFAULT_RUNNER_DOMAIN: runner:3003
      DEFAULT_RUNNER_API_URL: http://runner:3003
      DEFAULT_RUNNER_PROXY_URL: http://runner:3003
      DEFAULT_RUNNER_API_KEY: ${DAYTONA_RUNNER_TOKEN:?必须设置}
      RUNNER_DECLARATIVE_BUILD_SCORE_THRESHOLD: "10"
      RUNNER_AVAILABILITY_SCORE_THRESHOLD: "10"
      RUNNER_START_SCORE_THRESHOLD: "3"
      DEFAULT_RUNNER_CPU: ${DAYTONA_RUNNER_CPU:-4}
      DEFAULT_RUNNER_MEMORY: ${DAYTONA_RUNNER_MEMORY:-8}
      DEFAULT_RUNNER_DISK: ${DAYTONA_RUNNER_DISK:-50}
      DEFAULT_RUNNER_NAME: default
      DEFAULT_REGION_ID: local
      DEFAULT_REGION_NAME: local
      DEFAULT_REGION_ENFORCE_QUOTAS: "false"
      DEFAULT_ORG_QUOTA_TOTAL_CPU_QUOTA: ${DAYTONA_TOTAL_CPU_QUOTA:-64}
      DEFAULT_ORG_QUOTA_TOTAL_MEMORY_QUOTA: ${DAYTONA_TOTAL_MEMORY_QUOTA:-128}
      DEFAULT_ORG_QUOTA_TOTAL_DISK_QUOTA: ${DAYTONA_TOTAL_DISK_QUOTA:-1000}
      DEFAULT_ORG_QUOTA_MAX_CPU_PER_SANDBOX: ${DAYTONA_MAX_CPU_PER_SANDBOX:-8}
      DEFAULT_ORG_QUOTA_MAX_MEMORY_PER_SANDBOX: ${DAYTONA_MAX_MEMORY_PER_SANDBOX:-16}
      DEFAULT_ORG_QUOTA_MAX_DISK_PER_SANDBOX: ${DAYTONA_MAX_DISK_PER_SANDBOX:-100}
      DEFAULT_ORG_QUOTA_SNAPSHOT_QUOTA: "100"
      DEFAULT_ORG_QUOTA_MAX_SNAPSHOT_SIZE: "100"
      DEFAULT_ORG_QUOTA_VOLUME_QUOTA: "100"
      SSH_GATEWAY_API_KEY: ${DAYTONA_SSH_GATEWAY_API_KEY:?必须设置}
      HEALTH_CHECK_API_KEY: ${DAYTONA_HEALTH_API_KEY:?必须设置}
      SKIP_USER_EMAIL_VERIFICATION: "true"
      RUN_MIGRATIONS: "true"
    networks: [daytona-network]
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner:
        condition: service_started
      dex:
        condition: service_started
      registry:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  proxy:
    image: ${DAYTONA_IMAGE_REGISTRY:-docker.io}/daytonaio/daytona-proxy:v0.189.0-${DAYTONA_IMAGE_ARCH:-amd64}
    ports:
      - "0.0.0.0:${DAYTONA_PROXY_PORT:-33044}:4000"
    environment:
      DAYTONA_API_URL: http://api:3000/api
      PROXY_PORT: "4000"
      PROXY_API_KEY: ${DAYTONA_PROXY_API_KEY:?必须设置}
      PROXY_PROTOCOL: ${DAYTONA_PUBLIC_SCHEME:-http}
      OIDC_CLIENT_ID: daytona
      OIDC_DOMAIN: http://dex:5556/dex
      OIDC_PUBLIC_DOMAIN: ${DAYTONA_PUBLIC_SCHEME:-http}://${DAYTONA_PUBLIC_HOST:-127.0.0.1}:${DAYTONA_DEX_PORT:-33047}/dex
      OIDC_AUDIENCE: daytona
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${DAYTONA_REDIS_PASSWORD:?必须设置}
      TOOLBOX_ONLY_MODE: "false"
      PREVIEW_WARNING_ENABLED: "false"
    networks: [daytona-network]
    depends_on: [api, dex, redis]
    restart: unless-stopped

  runner:
    image: ${DAYTONA_IMAGE_REGISTRY:-docker.io}/daytonaio/daytona-runner:v0.189.0-${DAYTONA_IMAGE_ARCH:-amd64}
    environment:
      ENVIRONMENT: production
      API_PORT: "3003"
      DAYTONA_RUNNER_TOKEN: ${DAYTONA_RUNNER_TOKEN:?必须设置}
      LOG_FILE_PATH: /home/daytona/runner/runner.log
      RESOURCE_LIMITS_DISABLED: "true"
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${DAYTONA_MINIO_USER:-daytona}
      AWS_SECRET_ACCESS_KEY: ${DAYTONA_MINIO_PASSWORD:?必须设置}
      AWS_DEFAULT_BUCKET: daytona
      DAYTONA_API_URL: http://api:3000/api
      RUNNER_DOMAIN: runner
      SSH_GATEWAY_ENABLE: "false"
      INTER_SANDBOX_NETWORK_ENABLED: "false"
      DAEMON_START_TIMEOUT_SEC: "60"
      SANDBOX_START_TIMEOUT_SEC: "30"
      ANDROID_BOOT_TIMEOUT_SEC: "300"
    networks: [daytona-network]
    volumes:
      - ./data/runner:/home/daytona/runner
    privileged: true
    restart: unless-stopped

  dex:
    image: docker.io/dexidp/dex:v2.42.0
    ports:
      - "0.0.0.0:${DAYTONA_DEX_PORT:-33047}:5556"
    environment:
      DEX_ISSUER: ${DAYTONA_PUBLIC_SCHEME:-http}://${DAYTONA_PUBLIC_HOST:-127.0.0.1}:${DAYTONA_DEX_PORT:-33047}/dex
      DEX_DASHBOARD_BASE_URL: ${DAYTONA_PUBLIC_SCHEME:-http}://${DAYTONA_PUBLIC_HOST:-127.0.0.1}:${DAYTONA_API_PORT:-33043}
      DEX_PROXY_CALLBACK_URL: ${DAYTONA_PUBLIC_SCHEME:-http}://${DAYTONA_PROXY_DOMAIN:-proxy.localhost:33044}/callback
      DEX_STATIC_PASSWORD_HASH: ${DEX_STATIC_PASSWORD_HASH:?必须设置}
      DEX_ADMIN_EMAIL: ${DEX_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - ./dex/config.yaml.template:/etc/dex/config.yaml.template:ro
      - ./data/dex:/var/dex
    entrypoint:
      - sh
      - -ec
      - sed -e "s|__DEX_ISSUER__|$$DEX_ISSUER|g" -e "s|__DEX_DASHBOARD_BASE_URL__|$$DEX_DASHBOARD_BASE_URL|g" -e "s|__DEX_PROXY_CALLBACK_URL__|$$DEX_PROXY_CALLBACK_URL|g" -e "s|__DEX_ADMIN_EMAIL__|$$DEX_ADMIN_EMAIL|g" -e "s|__DEX_STATIC_PASSWORD_HASH__|$$DEX_STATIC_PASSWORD_HASH|g" /etc/dex/config.yaml.template > /tmp/dex.yaml && touch /var/dex/dex.db && exec dex serve /tmp/dex.yaml
    networks: [daytona-network]
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:18.0-alpine
    environment:
      POSTGRES_PASSWORD: ${DAYTONA_POSTGRES_PASSWORD:?必须设置}
      POSTGRES_USER: ${DAYTONA_POSTGRES_USER:-daytona}
      POSTGRES_DB: ${DAYTONA_POSTGRES_DB:-daytona}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./data/db:/var/lib/postgresql
    networks: [daytona-network]
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7.4.2-alpine
    command: [redis-server, --appendonly, "yes", --requirepass, "${DAYTONA_REDIS_PASSWORD:?必须设置}"]
    environment:
      REDIS_PASSWORD: ${DAYTONA_REDIS_PASSWORD:?必须设置}
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./data/redis:/data
    networks: [daytona-network]
    restart: unless-stopped

  registry:
    image: docker.io/library/registry:2.8.2
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: registry:6000
    volumes:
      - ./data/registry:/var/lib/registry
    networks: [daytona-network]
    restart: unless-stopped

  minio:
    image: docker.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    environment:
      MINIO_ROOT_USER: ${DAYTONA_MINIO_USER:-daytona}
      MINIO_ROOT_PASSWORD: ${DAYTONA_MINIO_PASSWORD:?必须设置}
      MINIO_IDENTITY_STS_EXPIRY: 24h
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks: [daytona-network]
    restart: unless-stopped

networks:
  daytona-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
