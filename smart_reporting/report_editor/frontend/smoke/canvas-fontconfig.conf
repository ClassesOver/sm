<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Opt in per browser process with FONTCONFIG_FILE. This managed Linux
       environment prioritizes these system WOFF2 faces, but its Chromium
       paints empty glyphs through that path. Keep distro fonts/fallbacks and
       document web fonts intact; do not edit /etc/fonts or product fonts. -->
  <include>/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont><glob>/usr/share/fonts/openai-sans/*.woff2</glob></rejectfont>
  </selectfont>
</fontconfig>
