name: ${COMPOSE_PROJECT_NAME:-agui-daytona}

services:
  env-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: env-init
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-mirrors.aliyun.com}
    profiles: [setup]
    working_dir: /workspace
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/workspace
    network_mode: none
    entrypoint: ["bash", "scripts/configure_daytona_env.sh"]
    command: ["/workspace/.env"]

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    env_file:
      - path: .env
        required: false
    ports:
      - "${AGENT_OS_BIND:-127.0.0.1}:${AGENT_OS_PORT:-7777}:${AGENT_OS_PORT:-7777}"
    environment:
      AGENT_POSTGRES_HOST: agent-db
      AGENT_POSTGRES_PORT: "5432"
      AGENT_POSTGRES_DB: ${AGENT_POSTGRES_DB:-dev}
      AGENT_POSTGRES_USER: ${AGENT_POSTGRES_USER:-odoo}
      AGENT_POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:?必须设置}
      DAYTONA_API_URL: http://api:3000/api
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      AGUI_WORKSPACE_HMAC_SECRET: ${AGUI_WORKSPACE_HMAC_SECRET:?必须与 Odoo agui_chat.workspace_hmac_secret 一致}
      AGENT_SKILLS_DIR: /opt/agent-skills
      AGENT_SKILLS_TRUSTED_UID: ${AGENT_SKILLS_TRUSTED_UID:-1000}
    volumes:
      - ${AGENT_SKILLS_DIR:-./deploy/daytona/skills}:/opt/agent-skills:ro
    depends_on:
      agent-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('AGENT_OS_PORT', '7777') + '/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  agent-db:
    image: ${DOCKER_REGISTRY_MIRROR:-docker.m.daocloud.io}/library/postgres:18.0-alpine
    environment:
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-dev}
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:?必须设置}
    ports:
      - "${AGENT_POSTGRES_BIND:-127.0.0.1}:${AGENT_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - agent_db_data:/var/lib/postgresql
    restart: unless-stopped

  api:
    image: ${DAYTONA_IMAGE_REGISTRY:-docker.io}/daytonaio/daytona-api:v0.189.0-${DAYTONA_IMAGE_ARCH:-amd64}
    profiles: [daytona]
    environment:
      OTEL_ENABLED: "false"
      DEFAULT_SNAPSHOT: ${DAYTONA_DEFAULT_SNAPSHOT:-docker.io/daytonaio/sandbox:0.5.0-slim}
      ENCRYPTION_KEY: ${DAYTONA_ENCRYPTION_KEY:?必须设置}
      ENCRYPTION_SALT: ${DAYTONA_ENCRYPTION_SALT:?必须设置}
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ${DAYTONA_POSTGRES_USER:?必须设置}
      DB_PASSWORD: ${DAYTONA_POSTGRES_PASSWORD:?必须设置}
      DB_DATABASE: ${DAYTONA_POSTGRES_DB:-daytona}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${DAYTONA_REDIS_PASSWORD:?必须设置}
      OIDC_CLIENT_ID: daytona
      OIDC_ISSUER_BASE_URL: http://dex:5556/dex
      PUBLIC_OIDC_DOMAIN: ${DAYTONA_PUBLIC_OIDC_DOMAIN:-http://127.0.0.1:13000/dex}
      OIDC_AUDIENCE: daytona
      DASHBOARD_URL: ${DAYTONA_DASHBOARD_URL:-http://127.0.0.1:13000/dashboard}
      DASHBOARD_BASE_API_URL: ${DAYTONA_DASHBOARD_BASE_API_URL:-http://127.0.0.1:13000}
      TRANSIENT_REGISTRY_URL: http://registry:6000
      TRANSIENT_REGISTRY_ADMIN: ${DAYTONA_REGISTRY_USER:?必须设置}
      TRANSIENT_REGISTRY_PASSWORD: ${DAYTONA_REGISTRY_PASSWORD:?必须设置}
      TRANSIENT_REGISTRY_PROJECT_ID: daytona
      INTERNAL_REGISTRY_URL: http://registry:6000
      INTERNAL_REGISTRY_ADMIN: ${DAYTONA_REGISTRY_USER:?必须设置}
      INTERNAL_REGISTRY_PASSWORD: ${DAYTONA_REGISTRY_PASSWORD:?必须设置}
      INTERNAL_REGISTRY_PROJECT_ID: daytona
      S3_ENDPOINT: http://minio:9000
      S3_STS_ENDPOINT: http://minio:9000/minio/v1/assume-role
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${DAYTONA_MINIO_USER:?必须设置}
      S3_SECRET_KEY: ${DAYTONA_MINIO_PASSWORD:?必须设置}
      S3_DEFAULT_BUCKET: daytona
      S3_ACCOUNT_ID: /
      S3_ROLE_NAME: /
      ENVIRONMENT: docker-compose
      MAX_AUTO_ARCHIVE_INTERVAL: "43200"
      MAINTENANCE_MODE: "false"
      NOTIFICATION_GATEWAY_DISABLED: "true"
      PROXY_DOMAIN: ${DAYTONA_PROXY_DOMAIN:-proxy.localhost:14000}
      PROXY_PROTOCOL: http
      PROXY_API_KEY: ${DAYTONA_PROXY_API_KEY:?必须设置}
      PROXY_TEMPLATE_URL: http://{{PORT}}-{{sandboxId}}.${DAYTONA_PROXY_DOMAIN:-proxy.localhost:14000}
      PROXY_TOOLBOX_BASE_URL: http://api:3000/api
      DEFAULT_RUNNER_DOMAIN: runner:3003
      DEFAULT_RUNNER_API_URL: http://runner:3003
      DEFAULT_RUNNER_PROXY_URL: http://runner:3003
      DEFAULT_RUNNER_API_KEY: ${DAYTONA_RUNNER_TOKEN:?必须设置}
      DEFAULT_RUNNER_CPU: ${DAYTONA_RUNNER_CPU:-4}
      DEFAULT_RUNNER_MEMORY: ${DAYTONA_RUNNER_MEMORY:-8}
      DEFAULT_RUNNER_DISK: ${DAYTONA_RUNNER_DISK:-50}
      DEFAULT_RUNNER_NAME: default
      DEFAULT_REGION_ID: local
      DEFAULT_REGION_NAME: local
      DEFAULT_REGION_ENFORCE_QUOTAS: "false"
      DEFAULT_ORG_QUOTA_TOTAL_CPU_QUOTA: ${DAYTONA_TOTAL_CPU_QUOTA:-64}
      DEFAULT_ORG_QUOTA_TOTAL_MEMORY_QUOTA: ${DAYTONA_TOTAL_MEMORY_QUOTA:-128}
      DEFAULT_ORG_QUOTA_TOTAL_DISK_QUOTA: ${DAYTONA_TOTAL_DISK_QUOTA:-1000}
      DEFAULT_ORG_QUOTA_MAX_CPU_PER_SANDBOX: ${DAYTONA_MAX_CPU_PER_SANDBOX:-8}
      DEFAULT_ORG_QUOTA_MAX_MEMORY_PER_SANDBOX: ${DAYTONA_MAX_MEMORY_PER_SANDBOX:-16}
      DEFAULT_ORG_QUOTA_MAX_DISK_PER_SANDBOX: ${DAYTONA_MAX_DISK_PER_SANDBOX:-100}
      DEFAULT_ORG_QUOTA_SNAPSHOT_QUOTA: "100"
      DEFAULT_ORG_QUOTA_MAX_SNAPSHOT_SIZE: "100"
      DEFAULT_ORG_QUOTA_VOLUME_QUOTA: "100"
      SKIP_USER_EMAIL_VERIFICATION: "true"
      RUN_MIGRATIONS: "true"
      HEALTH_CHECK_API_KEY: ${DAYTONA_HEALTH_API_KEY:?必须设置}
    restart: unless-stopped
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner:
        condition: service_started
      dex:
        condition: service_started
      registry:
        condition: service_started
      minio:
        condition: service_started

  proxy:
    image: ${DAYTONA_IMAGE_REGISTRY:-docker.io}/daytonaio/daytona-proxy:v0.189.0-${DAYTONA_IMAGE_ARCH:-amd64}
    profiles: [daytona]
    environment:
      DAYTONA_API_URL: http://api:3000/api
      PROXY_PORT: "4000"
      PROXY_API_KEY: ${DAYTONA_PROXY_API_KEY:?必须设置}
      PROXY_PROTOCOL: http
      OIDC_CLIENT_ID: daytona
      OIDC_DOMAIN: http://dex:5556/dex
      OIDC_PUBLIC_DOMAIN: ${DAYTONA_PUBLIC_OIDC_DOMAIN:-http://127.0.0.1:13000/dex}
      OIDC_AUDIENCE: daytona
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${DAYTONA_REDIS_PASSWORD:?必须设置}
      TOOLBOX_ONLY_MODE: "false"
      PREVIEW_WARNING_ENABLED: "true"
    ports:
      - "${DAYTONA_PROXY_BIND:-127.0.0.1}:${DAYTONA_PROXY_PORT:-14000}:4000"
    restart: unless-stopped
    depends_on: [api, dex, redis]

  runner:
    image: ${DAYTONA_IMAGE_REGISTRY:-docker.io}/daytonaio/daytona-runner:v0.189.0-${DAYTONA_IMAGE_ARCH:-amd64}
    profiles: [daytona]
    environment:
      ENVIRONMENT: production
      API_PORT: "3003"
      DAYTONA_RUNNER_TOKEN: ${DAYTONA_RUNNER_TOKEN:?必须设置}
      LOG_FILE_PATH: /home/daytona/runner/runner.log
      RESOURCE_LIMITS_DISABLED: "false"
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${DAYTONA_MINIO_USER:?必须设置}
      AWS_SECRET_ACCESS_KEY: ${DAYTONA_MINIO_PASSWORD:?必须设置}
      AWS_DEFAULT_BUCKET: daytona
      DAYTONA_API_URL: http://api:3000/api
      RUNNER_DOMAIN: runner
      SSH_GATEWAY_ENABLE: "false"
      INTER_SANDBOX_NETWORK_ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - daytona_runner_data:/home/daytona/runner
    privileged: true
    restart: unless-stopped

  dex:
    image: ${DOCKER_REGISTRY_MIRROR:-docker.m.daocloud.io}/dexidp/dex:v2.42.0
    profiles: [daytona]
    environment:
      DEX_ISSUER: ${DAYTONA_PUBLIC_OIDC_DOMAIN:-http://127.0.0.1:13000/dex}
      DEX_DASHBOARD_BASE_URL: ${DAYTONA_DASHBOARD_BASE_API_URL:-http://127.0.0.1:13000}
      DEX_PROXY_CALLBACK_URL: http://${DAYTONA_PROXY_DOMAIN:-proxy.localhost:14000}/callback
      DEX_STATIC_PASSWORD_HASH: ${DEX_STATIC_PASSWORD_HASH:?必须由 env-init 生成 bcrypt 哈希}
      DEX_ADMIN_EMAIL: ${DEX_ADMIN_EMAIL:?必须设置}
    volumes:
      - ./deploy/daytona/dex/config.yaml.template:/etc/dex/config.yaml.template:ro
      - dex_data:/var/dex
    entrypoint:
      - sh
      - -ec
      - sed -e "s|__DEX_ISSUER__|$$DEX_ISSUER|g" -e "s|__DEX_DASHBOARD_BASE_URL__|$$DEX_DASHBOARD_BASE_URL|g" -e "s|__DEX_PROXY_CALLBACK_URL__|$$DEX_PROXY_CALLBACK_URL|g" -e "s|__DEX_ADMIN_EMAIL__|$$DEX_ADMIN_EMAIL|g" -e "s|__DEX_STATIC_PASSWORD_HASH__|$$DEX_STATIC_PASSWORD_HASH|g" /etc/dex/config.yaml.template > /tmp/dex.yaml && touch /var/dex/dex.db && exec dex serve /tmp/dex.yaml
    restart: unless-stopped

  db:
    image: ${DOCKER_REGISTRY_MIRROR:-docker.m.daocloud.io}/library/postgres:18.0-alpine
    profiles: [daytona]
    environment:
      POSTGRES_PASSWORD: ${DAYTONA_POSTGRES_PASSWORD:?必须设置}
      POSTGRES_USER: ${DAYTONA_POSTGRES_USER:?必须设置}
      POSTGRES_DB: ${DAYTONA_POSTGRES_DB:-daytona}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - daytona_db_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: ${DOCKER_REGISTRY_MIRROR:-docker.m.daocloud.io}/library/redis:7.4.2-alpine
    profiles: [daytona]
    command: [redis-server, --appendonly, "yes", --requirepass, "${DAYTONA_REDIS_PASSWORD:?必须设置}"]
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${DAYTONA_REDIS_PASSWORD:?必须设置}
    volumes:
      - daytona_redis_data:/data
    restart: unless-stopped

  registry:
    image: ${DOCKER_REGISTRY_MIRROR:-docker.m.daocloud.io}/library/registry:2.8.2
    profiles: [daytona]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: registry:6000
    volumes:
      - daytona_registry_data:/var/lib/registry
    restart: unless-stopped

  minio:
    image: ${DOCKER_REGISTRY_MIRROR:-docker.m.daocloud.io}/minio/minio:RELEASE.2025-02-28T09-55-16Z
    profiles: [daytona]
    environment:
      MINIO_ROOT_USER: ${DAYTONA_MINIO_USER:?必须设置}
      MINIO_ROOT_PASSWORD: ${DAYTONA_MINIO_PASSWORD:?必须设置}
      MINIO_IDENTITY_STS_EXPIRY: 24h
    command: server /data
    volumes:
      - daytona_minio_data:/data
    restart: unless-stopped

  dashboard:
    image: ${DOCKER_REGISTRY_MIRROR:-docker.m.daocloud.io}/library/nginx:1.27.4-alpine
    profiles: [daytona]
    ports:
      - "${DAYTONA_DASHBOARD_BIND:-127.0.0.1}:${DAYTONA_DASHBOARD_PORT:-13000}:80"
    volumes:
      - ./deploy/daytona/dashboard.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, dex]
    restart: unless-stopped

volumes:
  agent_db_data:
  daytona_runner_data:
  daytona_db_data:
  daytona_redis_data:
  daytona_registry_data:
  daytona_minio_data:
  dex_data:

networks:
  default:
    external: true
    name: ${AGUI_SHARED_NETWORK:-hrp_network}
