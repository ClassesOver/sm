services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    env_file:
      - path: .env
        required: false
    ports:
      - "${AGENT_OS_PORT:-7777}:${AGENT_OS_PORT:-7777}"
    environment:
      AGENT_DB_FILE: /data/agui_agentos.db
    volumes:
      - agent_data:/data

volumes:
  agent_data:
