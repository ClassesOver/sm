name: ${AGENTOS_COMPOSE_PROJECT_NAME:-agentos-reporting}

services:
  reporting-os:
    image: ${AGENTOS_REPORTING_IMAGE:-agentos-reporting-reporting-os:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
      - "proxy.localhost:172.17.0.1"
    ports:
      - "33046:7777"
    environment:
      AGENT_OS_WORKERS: "1"
      AGNO_TELEMETRY: "false"
      AGENT_LOG_FILE: /var/log/agentos/agentos.log
      AGENT_LOG_FILE_MAX_BYTES: ${AGENT_LOG_FILE_MAX_BYTES:-52428800}
      AGENT_LOG_FILE_BACKUP_COUNT: ${AGENT_LOG_FILE_BACKUP_COUNT:-5}
      AGENT_POSTGRES_HOST: reporting-db
      AGENT_POSTGRES_PORT: "5432"
      AGENT_POSTGRES_DB: ${AGENT_POSTGRES_DB:-dev}
      AGENT_POSTGRES_USER: ${AGENT_POSTGRES_USER:-odoo}
      AGENT_POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:?必须设置}
      AGENT_DAYTONA_API_URL: ${AGENT_DAYTONA_API_URL:-http://host.docker.internal:33043/api}
      DAYTONA_API_URL: ${AGENT_DAYTONA_API_URL:-http://host.docker.internal:33043/api}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_NETWORK_ALLOW_LIST: ${DAYTONA_NETWORK_ALLOW_LIST:-}
      AGENT_WORKSPACE_HMAC_SECRET: ${AGENT_WORKSPACE_HMAC_SECRET:?必须设置}
      AGENT_SKILLS_DIR: /opt/agent-skills
      TIKTOKEN_CACHE_DIR: /opt/tiktoken-cache
      AGENT_REPORT_DATA_SOURCES_DIR: /run/agentos/reporting
      AGENT_REPORT_METADATA_URL: ${AGENT_REPORT_METADATA_URL:-}
      AGENT_REPORT_METADATA_TOKEN: ${AGENT_REPORT_METADATA_TOKEN:-}
      AGENT_REPORT_PUBLIC_BASE_URL: ${AGENT_REPORT_PUBLIC_BASE_URL:-}
      REPORT_STARROCKS_DSN: ${REPORT_STARROCKS_DSN:-}
    volumes:
      - type: bind
        source: ./smart_reporting
        target: /app/smart_reporting
        read_only: true
      - ./data/reporting-logs:/var/log/agentos
      - ${AGENT_SKILLS_DIR:-./deploy/agentos/skills}:/opt/agent-skills:ro
      - type: bind
        source: ${AGENT_TIKTOKEN_CACHE_DIR:-./data/tiktoken-cache}
        target: /opt/tiktoken-cache
      - type: bind
        source: ${AGENT_REPORT_DATA_SOURCES_DIR:-./deploy/agentos/reporting}
        target: /run/agentos/reporting
        read_only: true
    depends_on:
      reporting-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('AGENT_OS_PORT', '7777') + '/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  reporting-db:
    image: docker.io/library/postgres:18.0-alpine
    environment:
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-dev}
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:?必须设置}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./data/reporting-db:/var/lib/postgresql
    restart: unless-stopped

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.17.0.0/16
          gateway: 172.17.0.1
