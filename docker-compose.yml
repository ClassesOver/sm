services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    env_file:
      - path: .env
        required: false
    ports:
      - "${AGENT_OS_PORT:-7777}:${AGENT_OS_PORT:-7777}"
    environment:
      AGENT_DB_URL: postgresql+psycopg://${AGENT_POSTGRES_USER:-odoo}:${AGENT_POSTGRES_PASSWORD:?Required}@agent-db:5432/${AGENT_POSTGRES_DB:-dev}
    depends_on:
      agent-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('AGENT_OS_PORT', '7777') + '/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  agent-db:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-dev}
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:?Required}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - agent_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  agent_db_data:
